services:
  - type: web
    name: asmaa-workshop
    runtime: docker
    plan: starter
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: php artisan migrate --force
    disk:
      name: private-documents
      mountPath: /var/www/html/storage/app/private
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://asmaa-workshop.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: asmaa-workshop-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: asmaa-workshop-db
    plan: basic-256mb
    databaseName: asmaa_workshop
    user: asmaa_workshop