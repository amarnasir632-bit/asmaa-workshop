name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip
          coverage: none
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install frontend dependencies
        run: npm ci
      - name: Run SQLite tests
        run: php artisan test
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Build frontend assets
        run: npm run build
      - name: Validate Composer files
        run: composer validate --no-check-publish

  mysql-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-password
          MYSQL_DATABASE: asmaa_workshop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-ci-root-password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run migrations and feature tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: asmaa_workshop_test
          DB_USERNAME: root
          DB_PASSWORD: synthetic-ci-root-password
        run: php artisan test
